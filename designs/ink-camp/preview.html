<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>营地</title>
<style>
html,body{margin:0;background:#FDF6ED}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#FDF6ED;color:#172F4E;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
.phone img{position:absolute;left:0;top:96px;width:390px;height:560px;object-fit:contain}
.row{position:absolute;left:16px;right:16px;top:20px;display:flex;gap:8px}
.chip{flex:1;height:40px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:6px;background:#FDF6ED;border:1px solid #172F4E;font-size:15px;font-weight:650}
.dock{position:absolute;left:20px;right:20px;bottom:28px;display:flex;flex-direction:column;gap:12px}
.chapter{text-align:center;font-size:15px;font-weight:650}
.go{height:64px;border:0;background:#172F4E;color:#FDF6ED;font-size:28px;font-weight:700;font-family:inherit}
.pair{display:flex;gap:8px}
.pair button{flex:1;height:44px;background:#FDF6ED;color:#172F4E;border:1px solid #172F4E;font-size:16px;font-weight:650;font-family:inherit}
</style>
</head>
<body>
<div class="phone">
  <img src="scene.jpg" alt="">
  <div class="row">
    <div class="chip"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M9 1 L4 9 h4 l-1 6 6-9 H9 z" fill="#D25F30"></path></svg>2/12</div>
    <div class="chip"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="6" y="1" width="4" height="3" rx="1" fill="#172F4E"></rect><rect x="4" y="4" width="8" height="10" rx="2" fill="#172F4E"></rect></svg>93</div>
    <div class="chip"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 L14 8 L8 15 L2 8 Z" fill="#D25F30"></path></svg>2</div>
  </div>
  <div class="chapter" style="position:absolute;left:0;right:0;top:72px">火山</div>
  <div class="dock">
    <button class="go" type="button">开炮</button>
    <div class="pair">
      <button type="button">炮台</button>
      <button type="button">道具</button>
    </div>
  </div>
</div>
</body>
</html>
